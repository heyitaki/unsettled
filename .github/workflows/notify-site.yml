# The site's jekyll.yml lists this file's green push runs by file name, and
# dispatch-site.yml triggers on the name "Check and deploy": renaming either
# breaks the site and OTA publish.
name: Check and deploy

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # The Rust jobs read only these paths, so a web-only commit skips them; a
  # skipped job still leaves the run green for the site dispatch.
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'simulator/**'
              - 'src/engine/advice/engine.wasm*'
              - 'src/parser/__tests__/expected/board-draft-empty.json'
              - '.github/workflows/notify-site.yml'
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The updater plugin belongs to the iOS build only.
      - run: "! grep -rq CapacitorUpdater dist"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  # The e2e suite keeps one worker per run (see playwright.config.ts), so it is
  # split across runners instead: each shard has its own dev server and browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        profile: [debug, release]
    env:
      # The debug leg exists for debug assertions and overflow checks, not for
      # unoptimised code, which ran the engine's unit tests 16x slower than
      # release. Fat LTO only speeds up the shipped binaries and makes every
      # test binary slow to link, so the release leg tests without it.
      CARGO_PROFILE_DEV_OPT_LEVEL: "3"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulator
          key: ${{ matrix.profile }}
      # nextest runs every test binary's tests across all cores at once, where
      # cargo test runs the binaries one after another. The crates have no doctests.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test simulator and placement parity
        working-directory: simulator
        run: cargo nextest run --workspace ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Check the committed wasm is current
        run: simulator/tools/build-wasm.sh --check
