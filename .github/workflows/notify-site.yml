# The site's jekyll.yml lists this file's green push runs by file name, and
# dispatch-site.yml triggers on the name "Check and deploy": renaming either
# breaks the site and OTA publish.
name: Check and deploy

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The updater plugin belongs to the iOS build only.
      - run: "! grep -rq CapacitorUpdater dist"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        profile: [debug, release]
    env:
      # The debug leg exists for debug assertions and overflow checks, not for
      # unoptimised code, which ran the engine's unit tests 16x slower than
      # release. Fat LTO only speeds up the shipped binaries and makes every
      # test binary slow to link, so the release leg tests without it.
      CARGO_PROFILE_DEV_OPT_LEVEL: "3"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulator
      - name: Test simulator and placement parity
        working-directory: simulator
        run: cargo test --workspace ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Check the committed wasm is current
        run: simulator/tools/build-wasm.sh --check
