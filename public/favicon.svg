<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.5 11.5 84 84">
  <!-- The mark Brand.tsx draws: one tile, three candidate corners sized by rank, the best in ember. The mask cuts the outline around each dot so the icon works on any tab colour. -->
  <style>.line { stroke: #2d2924; } .dot { fill: #2d2924; } @media (prefers-color-scheme: dark) { .line { stroke: #fbf8f1; } .dot { fill: #fbf8f1; } }</style>
  <mask id="cut"><rect width="100" height="100" fill="#fff"/><circle cx="80.31" cy="32.5" r="14"/><circle cx="50" cy="85" r="10"/><circle cx="19.69" cy="32.5" r="7.5"/></mask>
  <polygon class="line" points="50,15 80.31,32.5 80.31,67.5 50,85 19.69,67.5 19.69,32.5" fill="none" stroke-width="6" stroke-linejoin="round" mask="url(#cut)"/>
  <circle cx="80.31" cy="32.5" r="12" fill="#cd5037"/>
  <circle class="dot" cx="50" cy="85" r="8"/>
  <circle class="dot" cx="19.69" cy="32.5" r="5.5"/>
</svg>
