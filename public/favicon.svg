<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 9.5 86 86">
  <!-- The mark Brand.tsx draws: one sharp-cornered tile, three candidate corners sized by rank, the best in ember and the runners-up in wheat and wood. The mask cuts the outline around each dot so the icon works on any tab colour. -->
  <style>.line { stroke: #2d2924; } @media (prefers-color-scheme: dark) { .line { stroke: #fbf8f1; } }</style>
  <mask id="cut"><rect x="0" y="0" width="110" height="110" fill="#fff"/><circle cx="80.31" cy="32.5" r="16"/><circle cx="50" cy="85" r="12"/><circle cx="19.69" cy="32.5" r="9"/></mask>
  <polygon class="line" points="50,15 80.31,32.5 80.31,67.5 50,85 19.69,67.5 19.69,32.5" fill="none" stroke-width="9" stroke-linejoin="miter" mask="url(#cut)"/>
  <circle cx="80.31" cy="32.5" r="14" fill="#cd5037"/>
  <circle cx="50" cy="85" r="10" fill="#e3b23c"/>
  <circle cx="19.69" cy="32.5" r="7" fill="#1e7a3a"/>
</svg>
